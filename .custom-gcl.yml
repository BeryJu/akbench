# This file configures golangci-lint with module plugins.
# When you run 'make lint', it will automatically build a custom golangci-lint binary
# with all the plugins listed below.
#
# See: https://golangci-lint.run/plugins/module-plugins/
#
# v2.12.2's bundled staticcheck (honnef.co/go/tools v0.7.0) panics building
# the IR for net/internal/poll on Go 1.27+ (its own stdlib now uses direct
# references to embedded fields in struct initializers, a language feature
# that IR builder predates). Fixed upstream in staticcheck v0.8.0, bundled
# from golangci-lint v2.13.2 - confirmed against this exact panic, not
# guessed. This is the version `make lint` actually runs (golangci-lint's own
# `custom` subcommand rebuilds against the version pinned here, regardless of
# the Makefile's own GOLANGCI_LINT_VERSION), so both must move together.
version: v2.14.0
plugins:
  # logcheck validates structured logging calls and parameters (e.g., balanced key-value pairs)
  - module: "sigs.k8s.io/logtools"
    import: "sigs.k8s.io/logtools/logcheck/gclplugin"
    version: latest
