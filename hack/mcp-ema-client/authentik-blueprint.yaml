# authentik as the enterprise IdP for MCP Enterprise-Managed Authorization
# (ID-JAG) against akbench's MCP endpoint. akbench is its own authorization
# server: the MCP client logs in at akbench-ema-idp, exchanges its ID token
# there for an ID-JAG addressed to akbench, and redeems that at akbench's
# token endpoint (RFC 7523 JWT bearer grant).
# What the IdP may mint ID-JAGs for (akbench's issuer, client ID and MCP
# URL) lives on an authentik system agent, set up in the admin interface;
# see the README.
version: 1
metadata:
  name: akbench MCP Enterprise-Managed Authorization
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: idp-provider
    identifiers:
      name: akbench-ema-idp
    attrs:
      client_type: confidential
      client_id: akbench-ema-idp
      grant_types:
        - authorization_code
        - urn:ietf:params:oauth:grant-type:token-exchange
      redirect_uris:
        - matching_mode: strict
          url: http://127.0.0.1:8976/callback
      # A stable user ID for akbench to see as the ID-JAG's sub
      sub_mode: user_uuid
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      # akbench verifies ID-JAGs against the JWKS, so this needs an asymmetric key
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
  - model: authentik_core.application
    identifiers:
      slug: akbench-ema-idp
    attrs:
      name: akbench EMA IdP
      provider: !KeyOf idp-provider
