# In-cluster deployment of cmd/apiserver: the REST API, the web UI
# (web/ui, baked into the same image) and the in-browser kubectl shell, all
# from one process. Applied by
# hack/deploy-apiserver.sh (make deploy-apiserver) against whatever image
# that script just built/loaded (authentik-bench-apiserver:dev for local
# dev - see that script). Open the UI at http://<node>:30911/.
#
# cluster-admin, matching this repo's existing dev-only security posture
# (the operator itself is bound the same way) - not
# appropriate for a real multi-tenant deployment, fine for this benchmark
# tool.
apiVersion: v1
kind: Namespace
metadata:
  name: authentik-bench
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: apiserver
  namespace: authentik-bench
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: authentik-bench-apiserver
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: apiserver
    namespace: authentik-bench
---
apiVersion: v1
kind: Secret
metadata:
  name: apiserver-token
  namespace: authentik-bench
type: Opaque
stringData:
  # Dev-only fixed token - matches BENCH_API_TOKEN below. Real deployments
  # should generate this instead of using a literal.
  token: dev-token
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apiserver
  namespace: authentik-bench
  labels:
    app: authentik-bench-apiserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authentik-bench-apiserver
  template:
    metadata:
      labels:
        app: authentik-bench-apiserver
    spec:
      serviceAccountName: apiserver
      containers:
        - name: apiserver
          image: authentik-bench-apiserver:dev
          imagePullPolicy: IfNotPresent
          env:
            # Matches where this dev session's own AuthentikDeployment/etc.
            # objects actually live - see the namespace-mismatch bug this
            # session already hit once with the Next.js UI's own apiserver.
            - name: BENCH_NAMESPACE
              value: default
            # The management cluster's own Prometheus - reachable directly
            # via in-cluster DNS since apiserver runs here too. This is only
            # the fallback/management-cluster case now:
            # internal/api/metrics.go resolves a workload cluster's own
            # Prometheus per-testid (WorkloadCluster.status.prometheusURL,
            # populated by WorkloadClusterReconciler's ensurePrometheus) -
            # see prometheusURLsForTestID. Confirmed via direct ping/wget
            # testing that pods on a workload cluster's overlay network have
            # zero route back into minikube's pod network (100% packet loss
            # even to the node IP), so a workload cluster's own k6 pods could
            # never have reached this address anyway - each cluster's
            # Prometheus has always had to be local to itself.
            - name: BENCH_PROMETHEUS_URL
              value: http://prometheus-server.bench-system.svc.cluster.local
            - name: BENCH_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: apiserver-token
                  key: token
            # The kubectl shell's kubeconfig: the merged one
            # ShellKubeconfigReconciler maintains (management cluster plus
            # every Ready WorkloadCluster). Read through the API for every
            # session rather than mounted, so a cluster that just became
            # Ready is usable at once.
            # Must match the operator's BENCH_SHELL_KUBECONFIG_NAMESPACE/
            # BENCH_SHELL_KUBECONFIG_SECRET_NAME (cmd/main.go).
            - name: BENCH_SHELL_KUBECONFIG_SECRET
              value: authentik-bench/shell-kubeconfig
            # OIDC login (internal/api/oidc.go), e.g. against an authentik
            # OAuth2/OpenID provider configured as a *public* client with
            # redirect URIs <origin>/auth/callback and <origin>/auth/silent.
            # Logging in grants a cluster-admin shell, so restrict the
            # application in the IdP and/or require a group here.
            # - name: BENCH_OIDC_ISSUER
            #   value: https://authentik.example.com/application/o/authentik-bench/
            # - name: BENCH_OIDC_CLIENT_ID
            #   value: authentik-bench
            # - name: BENCH_OIDC_REQUIRED_GROUP
            #   value: authentik-bench-admins
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: apiserver
  namespace: authentik-bench
spec:
  selector:
    app: authentik-bench-apiserver
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
# NodePort twin of the ClusterIP Service above, matching
# render.PrometheusNodePortServiceName/GrafanaNodePortServiceName's own
# convention (30909/30910 - this is 30911). How a browser reaches the web
# UI, the shell's WebSocket and /grafana-proxy/{cluster}/*
# (internal/api/grafana_proxy.go) directly.
apiVersion: v1
kind: Service
metadata:
  name: apiserver-nodeport
  namespace: authentik-bench
spec:
  type: NodePort
  selector:
    app: authentik-bench-apiserver
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30911
