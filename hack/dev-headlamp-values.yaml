# Helm values for the official headlamp-k8s/headlamp chart, installed via
# `make headlamp` (hack/install-headlamp.sh). Headlamp itself replaces the
# old web/frontend Next.js UI; cmd/apiserver stays and is reached from the
# new web/headlamp-plugin plugin through Headlamp's own ApiProxy -> the
# standard Kubernetes Service-proxy subresource, not a direct browser call.
#
# config.inCluster: false plus a mounted kubeconfig, rather than the chart's
# default (true, which only ever shows the one cluster Headlamp itself runs
# on) - the merged Secret internal/controller/headlampkubeconfig_controller.go
# maintains includes a synthesized "management" context alongside every
# CAPI-provisioned WorkloadCluster's own, so this one file is Headlamp's only
# source of cluster membership. in-cluster mode and kubeconfig-file mode
# aren't meant to be combined, which is why the management context has to be
# synthesized into the same file rather than layered on top of config.inCluster.
config:
  inCluster: false
  pluginsDir: /headlamp/plugins

# Copies the plugin (baked into an image by web/headlamp-plugin/Dockerfile)
# into the shared pluginsDir emptyDir on every pod start, so it survives a
# Headlamp pod restart - unlike `make headlamp-plugin`
# (hack/build-headlamp-plugin.sh), which kubectl cp's straight into a
# running pod's emptyDir for fast dev-loop iteration but is wiped the
# moment that pod restarts. Deployed by `make deploy-headlamp-plugin`
# (hack/deploy-headlamp-plugin.sh), which builds+loads the image and
# substitutes its unique tag in place of the "dev" placeholder below (see
# hack/deploy-apiserver.sh for why a unique tag rather than a fixed one -
# minikube's own image cache doesn't reliably replace same-tag content).
initContainers:
  - name: authentik-bench-plugin
    image: authentik-bench-headlamp-plugin:dev
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - name: plugins
        mountPath: /headlamp/plugins
volumes:
  - name: plugins
    emptyDir: {}
  - name: kubeconfig
    secret:
      # Must match HeadlampKubeconfigReconciler's SecretName
      # (BENCH_HEADLAMP_KUBECONFIG_SECRET, cmd/main.go).
      secretName: headlamp-kubeconfig
volumeMounts:
  - name: plugins
    mountPath: /headlamp/plugins
  - name: kubeconfig
    mountPath: /headlamp/kubeconfigs
    readOnly: true
env:
  - name: KUBECONFIG
    value: /headlamp/kubeconfigs/config
