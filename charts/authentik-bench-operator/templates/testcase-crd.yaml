apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: testcases.bench.goauthentik.io
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  labels:
  {{- include "authentik-bench-operator.labels" . | nindent 4 }}
spec:
  group: bench.goauthentik.io
  names:
    kind: TestCase
    listKind: TestCaseList
    plural: testcases
    singular: testcase
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.deploymentRef.name
      name: Deployment
      type: string
    - jsonPath: .spec.profile
      name: Profile
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: TestCase is the Schema for the testcases API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              TestCaseSpec defines one k6 load test: which AuthentikDeployment it drives,
              which script/profile/load shape it uses, and which flow it walks. The
              object's name is the k6 `testid` tag every dashboard splits on.
            properties:
              burnDuration:
                default: 8760h
                description: burnDuration caps a Burn run - effectively unlimited by
                  default.
                type: string
              deploymentRef:
                description: deploymentRef names the AuthentikDeployment this test drives.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              extraTags:
                additionalProperties:
                  type: string
                description: |-
                  extraTags are merged into the k6 --tag arguments alongside
                  testid/target/profile.
                type: object
              flow:
                default: default-authentication-flow
                type: string
              iterations:
                default: 1000
                description: iterations is logins per VU. Quick only.
                format: int32
                type: integer
              profile:
                description: |-
                  TestProfile decides how k6 runs a test - see the package doc comment for
                  the quick/burn distinction ported from the Ansible benchmark harness.
                enum:
                - Quick
                - Burn
                type: string
              quickDuration:
                default: 150s
                description: quickDuration caps a Quick run that cannot finish its iterations
                  in time.
                type: string
              runnerClusterRef:
                description: |-
                  runnerClusterRef names the cluster.x-k8s.io/v1beta1 Cluster the k6
                  workload itself runs on. Defaults to the deployment's clusterRef.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              script:
                default: login.ts
                description: script names a built-in script under k6/scripts (e.g. "login.ts").
                type: string
              scriptConfigMapRef:
                description: |-
                  scriptConfigMapRef, if set, overrides script with a user-supplied
                  script's contents (key "script.ts").
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              traceSampleRate:
                default: "0.01"
                description: |-
                  traceSampleRate is the share of login flows k6 marks as sampled in the
                  traceparent header it sends.
                type: string
              vus:
                default: 8
                format: int32
                minimum: 1
                type: integer
            required:
            - deploymentRef
            - profile
            type: object
          status:
            description: TestCaseStatus defines the observed state of TestCase.
            properties:
              burnWorkloadRef:
                description: burnWorkloadRef names the owned Deployment when profile
                  is Burn.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              conditions:
                description: conditions report Ready, DeploymentReady and ScriptReady.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: |-
                  phase summarizes the Ready condition at a glance - computed from
                  conditions, never set independently. See ReconcilePhase.
                enum:
                - Pending
                - Reconciling
                - Ready
                - Failed
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
status:
  acceptedNames:
    kind: ""
    plural: ""
  conditions: []
  storedVersions: []
