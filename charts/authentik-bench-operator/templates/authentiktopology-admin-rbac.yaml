apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "authentik-bench-operator.fullname" . }}-authentiktopology-admin-role
  labels:
  {{- include "authentik-bench-operator.labels" . | nindent 4 }}
rules:
- apiGroups:
  - bench.goauthentik.io
  resources:
  - authentiktopologies
  verbs:
  - '*'
- apiGroups:
  - bench.goauthentik.io
  resources:
  - authentiktopologies/status
  verbs:
  - get
