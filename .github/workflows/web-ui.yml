name: Web UI

on:
  push:
  pull_request:

permissions: {}

jobs:
  web-ui:
    permissions:
      contents: read
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/ui
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # @goauthentik/fonts and @goauthentik/theme both declare
          # engines.node >= 24 - npm only warns (EBADENGINE) rather than
          # failing on an older runtime, but there's no reason to run CI on
          # a version these dependencies themselves say isn't supported.
          node-version: 24
          cache: npm
          cache-dependency-path: web/ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
