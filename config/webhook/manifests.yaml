---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-bench-goauthentik-io-v1alpha1-authentikdeployment
  failurePolicy: Fail
  name: vauthentikdeployment-v1alpha1.kb.io
  rules:
  - apiGroups:
    - bench.goauthentik.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - authentikdeployments
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-bench-goauthentik-io-v1alpha1-testcase
  failurePolicy: Fail
  name: vtestcase-v1alpha1.kb.io
  rules:
  - apiGroups:
    - bench.goauthentik.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - testcases
  sideEffects: None
