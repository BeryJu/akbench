apiVersion: bench.goauthentik.io/v1alpha1
kind: WorkloadCluster
metadata:
  labels:
    app.kubernetes.io/name: authentik-bench
    app.kubernetes.io/managed-by: kustomize
  name: workloadcluster-sample
spec:
  kubernetesVersion: v1.31.0
  provider: Incus
  controlPlane:
    replicas: 1
  workers:
    replicas: 2
  incus:
    lxcSecretRef:
      name: lxc-secret
    controlPlane:
      flavor: c2-m4
    workers:
      flavor: c2-m4
