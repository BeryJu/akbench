apiVersion: bench.goauthentik.io/v1alpha1
kind: WorkloadCluster
metadata:
  labels:
    app.kubernetes.io/name: authentik-bench
    app.kubernetes.io/managed-by: kustomize
  name: workloadcluster-sample
spec:
  kubernetesVersion: v1.36.4
  provider: Incus
  controlPlane:
    replicas: 1
  workerPools:
    - name: workers
      replicas: 2
      incus:
        flavor: c2-m4
  incus:
    lxcSecretRef:
      name: lxc-secret
    controlPlane:
      flavor: c2-m4
